# Déploiement automatique : build Astro sur GitHub, envoi du dist/ vers Hostinger (FTP/FTPS).
# Secrets (Settings → Secrets and variables → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   FTP_SERVER = hôte FTP uniquement. Hostinger : utilise surtout la valeur « FTP IP » (adresse IPv4) affichée
#     dans hPanel → Comptes FTP ; évite un nom de domaine qui ne résout pas encore en public.
#     Pas de ftps://, pas de chemin, pas d’espace en trop.
# Optionnel : FTP_SERVER_DIR, FTP_PORT (défaut 21), FTP_PROTOCOL (ftp ou ftps, défaut ftps),
#   FTP_SKIP_DNS_CHECK = true pour ignorer le test DNS (dépannage seulement).

name: Deploy Hostinger (branche V4)

on:
  push:
    branches:
      - V4
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          err=0
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Le secret FTP_SERVER est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::Le secret FTP_USERNAME est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Le secret FTP_PASSWORD est vide ou absent."
            err=1
          fi
          exit $err

      - name: Normaliser l'hôte FTP et vérifier la DNS
        id: ftp_host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SKIP_DNS_CHECK: ${{ secrets.FTP_SKIP_DNS_CHECK }}
        run: |
          set -euo pipefail
          raw="${FTP_SERVER//$'\r'/}"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          host="$raw"
          host="$(printf '%s' "$host" | sed -E 's#^ftps?://##I')"
          host="$(printf '%s' "$host" | sed -E 's#/.*##')"
          host="$(printf '%s' "$host" | sed -E 's/:([0-9]{1,5})$//')"
          if [ -z "$host" ]; then
            echo "::error::Hôte FTP vide après normalisation. Mets dans FTP_SERVER une IP (recommandé Hostinger) ou un nom d'hôte seul, sans URL."
            exit 1
          fi

          if [ "${FTP_SKIP_DNS_CHECK:-}" = "true" ]; then
            echo "::warning::FTP_SKIP_DNS_CHECK=true : le test DNS est ignoré."
            echo "host=$host" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolves=0
          if getent hosts "$host" >/dev/null 2>&1; then resolves=1; fi
          if [ "$resolves" -eq 0 ] && command -v dig >/dev/null 2>&1; then
            if dig +short A "$host" @1.1.1.1 | head -n1 | grep -qE '^[0-9.]+$'; then resolves=1; fi
          fi
          if [ "$resolves" -eq 0 ] && command -v dig >/dev/null 2>&1; then
            if dig +short A "$host" @8.8.8.8 | head -n1 | grep -qE '^[0-9.]+$'; then resolves=1; fi
          fi

          if [ "$resolves" -eq 0 ]; then
            echo "::error::DNS : « $host » ne se résout pas depuis Internet (comme le ferait GitHub Actions). Sur Hostinger, ouvre hPanel → Comptes FTP et mets dans le secret FTP_SERVER la ligne « FTP IP » (adresse IPv4), pas le nom de ton site si le DNS n’est pas encore correct. Réf. Hostinger : « FTP IP – Your hosting IP, used as hostname to connect via FTP ». Vérifie aussi qu’il n’y a pas d’espace ou de retour à la ligne dans le secret."
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: V4

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          timeout: 600000
