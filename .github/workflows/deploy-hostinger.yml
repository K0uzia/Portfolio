# Déploiement automatique : build Astro sur GitHub, envoi du dist/ vers Hostinger (FTP/FTPS).
# Secrets (Settings → Secrets and variables → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   FTP_SERVER = uniquement le nom d'hôte (ex. ftp.tondomaine.com), sans ftps://, sans chemin, sans espace en trop.
# Optionnel : FTP_SERVER_DIR (dossier distant, finit par /), FTP_PORT (défaut 21), FTP_PROTOCOL (ftp ou ftps, défaut ftps).

name: Deploy Hostinger (branche V4)

on:
  push:
    branches:
      - V4
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          err=0
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Le secret FTP_SERVER est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::Le secret FTP_USERNAME est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Le secret FTP_PASSWORD est vide ou absent."
            err=1
          fi
          exit $err

      - name: Normaliser l'hôte FTP et vérifier la DNS
        id: ftp_host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          raw="${FTP_SERVER//$'\r'/}"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          host="$raw"
          host="$(printf '%s' "$host" | sed -E 's#^ftps?://##I')"
          host="$(printf '%s' "$host" | sed -E 's#/.*##')"
          host="$(printf '%s' "$host" | sed -E 's/:([0-9]{1,5})$//')"
          if [ -z "$host" ]; then
            echo "::error::Hôte FTP vide après normalisation. Mets dans FTP_SERVER seulement le nom (ex. ftp.example.com), pas une URL complète."
            exit 1
          fi
          if ! getent hosts "$host" >/dev/null 2>&1; then
            echo "::error::DNS : impossible de résoudre l'hôte « $host » (erreur ENOTFOUND). Dans hPanel (Fichiers / FTP), copie l'hôte FTP exact. Pas de https:// ni de chemin type /public_html. Si besoin, utilise l'adresse IP indiquée par Hostinger. Si ton domaine est tout neuf, attends la propagation DNS ou teste avec l'IP."
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: V4

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          timeout: 600000
