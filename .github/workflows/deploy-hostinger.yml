# Déploiement automatique : build Astro sur GitHub, envoi du dist/ vers Hostinger (FTP/FTPS).
# Secrets (Settings → Secrets and variables → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   FTP_SERVER = hôte FTP uniquement. Hostinger : utilise surtout la valeur « FTP IP » (adresse IPv4) affichée
#     dans hPanel → Comptes FTP ; évite un nom de domaine qui ne résout pas encore en public.
#     Pas de ftps://, pas de chemin, pas d’espace en trop.
# Optionnel : FTP_SERVER_DIR, FTP_PORT (défaut 21), FTP_PROTOCOL (ftp ou ftps, défaut ftps),
#   FTP_SKIP_DNS_CHECK = true pour ignorer le test DNS (dépannage seulement).

name: Deploy Hostinger (branche V4)

on:
  push:
    branches:
      - V4
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          err=0
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Le secret FTP_SERVER est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::Le secret FTP_USERNAME est vide ou absent."
            err=1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Le secret FTP_PASSWORD est vide ou absent."
            err=1
          fi
          exit $err

      - name: Normaliser l'hôte FTP et vérifier la DNS
        id: ftp_host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SKIP_DNS_CHECK: ${{ secrets.FTP_SKIP_DNS_CHECK }}
        run: |
          set -eu
          raw="${FTP_SERVER//$'\r'/}"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          # BOM UTF-8 éventuel (copier-coller depuis le navigateur)
          raw="$(printf '%s' "$raw" | sed $'1s/^\xef\xbb\xbf//')"
          host="$raw"
          host="$(printf '%s' "$host" | sed -E 's#^ftps?://##I')"
          # Ne pas couper une IPv6 : enlever un suffixe /chemin seulement si ça ressemble à une URL (contient / après un nom)
          if printf '%s' "$host" | grep -q '/'; then
            host="$(printf '%s' "$host" | sed -E 's#/.*##')"
          fi
          host="$(printf '%s' "$host" | sed -E 's/:([0-9]{1,5})$//')"
          # Caractères parasites (UI) : ne garder que chiffres et points ; si ça forme une IPv4, on l’utilise
          clean_ip="$(printf '%s' "$host" | LC_ALL=C tr -cd '0-9.')"
          is_ipv4() {
            local h="$1" a b c d
            [[ "$h" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || return 1
            a="${BASH_REMATCH[1]}"; b="${BASH_REMATCH[2]}"; c="${BASH_REMATCH[3]}"; d="${BASH_REMATCH[4]}"
            for x in "$a" "$b" "$c" "$d"; do
              (( 10#$x <= 255 )) || return 1
            done
            return 0
          }
          if is_ipv4 "$clean_ip"; then
            host="$clean_ip"
          fi
          if [ -z "$host" ]; then
            echo "::error::Hôte FTP vide après normalisation. Mets dans FTP_SERVER une IP (recommandé Hostinger) ou un nom d'hôte seul, sans URL."
            exit 1
          fi

          if [ "${FTP_SKIP_DNS_CHECK:-}" = "true" ]; then
            echo "::warning::FTP_SKIP_DNS_CHECK=true : le test DNS est ignoré."
            echo "host=$host" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # IPv4 littéral : pas de DNS à vérifier (évite faux négatifs / masquage logs)
          if is_ipv4 "$host"; then
            echo "::notice::IPv4 littéral : pas de test DNS (inutile pour une IP)."
            echo "host=$host" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          resolves=0
          if getent hosts "$host" >/dev/null 2>&1; then resolves=1; fi
          if [ "$resolves" -eq 0 ] && command -v dig >/dev/null 2>&1; then
            dig +short A "$host" @1.1.1.1 | head -n1 | grep -qE '^[0-9.]+$' && resolves=1
          fi
          if [ "$resolves" -eq 0 ] && command -v dig >/dev/null 2>&1; then
            dig +short A "$host" @8.8.8.8 | head -n1 | grep -qE '^[0-9.]+$' && resolves=1
          fi
          set -e

          if [ "$resolves" -eq 0 ]; then
            echo "::error::DNS : impossible de résoudre cet hôte depuis Internet. Pour Hostinger, mets dans FTP_SERVER uniquement les 4 nombres séparés par des points (ex. 93.184.216.34), sans ftp:// — idéalement en les retapant à la main pour éviter les caractères invisibles. Si c’est bien une IP et que le message persiste, ouvre une issue : le workflow a peut-être besoin d’être mis à jour."
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: V4

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          timeout: 600000
